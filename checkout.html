<!DOCTYPE html>
<html>
<head>
    <title>Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- Header -->
<header>
    <h1>Food Ordering Website</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="cart.html">Cart</a>
    </nav>
</header>

<!-- Checkout Section -->
<section class="home">
    <h2>Checkout</h2>

    <!-- Delivery Info -->
    <h3>Delivery Details</h3>

    <input type="text" placeholder="Full Name"><br><br>
    <input type="text" placeholder="Address"><br><br>
    <input type="text" placeholder="Phone Number"><br><br>

    <!-- Payment -->
    <h3>Payment Method</h3>

    <label><input type="radio" name="payment"> Cash on Delivery</label><br>
    <label><input type="radio" name="payment"> Credit Card</label><br><br>

    <!-- Order Summary -->
    <h3>Order Summary</h3>
    <p>Pizza - $12</p>
    <p>Burger - $10</p>

    <h3>Total: $22</h3>

    <!-- Button -->
    <a href="tracking.html">
        <button class="order-btn">Place Order</button>
    </a>

</section>

</body>
</html>
