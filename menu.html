<!DOCTYPE html>
<html>
<head>
    <title>Menu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Food Ordering Website</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="cart.html">Cart</a>
        <a href="order-history.html">Order History</a>
    </nav>
</header>

<section class="home">

    <h2>Menu</h2>

    <!-- Budget Filter -->
    <div class="budget-filter">
        <button onclick="filterFood('all')" class="filter-btn">All</button>
        <button onclick="filterFood(10)" class="filter-btn">Under $10</button>
        <button onclick="filterFood(15)" class="filter-btn">Under $15</button>
        <button onclick="filterFood(20)" class="filter-btn">Under $20</button>
    </div>

    <p id="filter-message">Showing all meals</p>

    <!-- Food List -->
    <div class="food-list">

        <div class="food-item" data-price="12">
            <h3>Pizza</h3>
            <p>$12</p>
            <button class="order-btn" onclick="addToCart('Pizza', 12)">Add to Cart</button>
        </div>

        <div class="food-item" data-price="10">
            <h3>Burger</h3>
            <p>$10</p>
            <button class="order-btn" onclick="addToCart('Burger', 10)">Add to Cart</button>
        </div>

        <div class="food-item" data-price="11">
            <h3>Pasta</h3>
            <p>$11</p>
            <button class="order-btn" onclick="addToCart('Pasta', 11)">Add to Cart</button>
        </div>

        <div class="food-item" data-price="6">
            <h3>Fries</h3>
            <p>$6</p>
            <button class="order-btn" onclick="addToCart('Fries', 6)">Add to Cart</button>
        </div>

        <div class="food-item" data-price="14">
            <h3>Chicken</h3>
            <p>$14</p>
            <button class="order-btn" onclick="addToCart('Chicken', 14)">Add to Cart</button>
        </div>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
