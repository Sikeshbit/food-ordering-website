<!DOCTYPE html>
<html>
<head>
    <title>Menu</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>
    <h1>Food Ordering Website</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="menu.html">Menu</a>
        <a href="cart.html">Cart</a>
        <a href="order-history.html">Order History</a>
    </nav>
</header>

<section class="home">

    <h2>Menu</h2>

    <!-- Budget Filter -->
    <div class="budget-filter">
        <button onclick="filterFood('all')" class="filter-btn">All</button>
        <button onclick="filterFood(10)" class="filter-btn">Under $10</button>
        <button onclick="filterFood(15)" class="filter-btn">Under $15</button>
        <button onclick="filterFood(20)" class="filter-btn">Under $20</button>
    </div>

    <p id="filter-message">Showing all meals</p>

    <!-- Food Cards -->
    <div class="food-list">

        <div class="food-item" data-price="12">
            <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?w=600" alt="Pizza">
            <h3>Cheese Pizza</h3>
            <p>$12</p>
            <button class="order-btn" onclick="addToCart('Cheese Pizza', 12)">Add to Cart</button>
        </div>

        <div class="food-item" data-price="10">
            <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600" alt="Burger">
            <h3>Beef Burger</h3>
            <p>$10</p>
            <button class="order-btn" onclick="addToCart('Beef Burger', 10)">Add to Cart</button>
        </div>

        <div class="food-item" data-price="11">
            <img src="https://images.unsplash.com/photo-1621996346565-e3dbc646d9a9?w=600" alt="Pasta">
            <h3>Spaghetti Pasta</h3>
            <p>$11</p>
            <button class="order-btn" onclick="addToCart('Spaghetti Pasta', 11)">Add to Cart</button>
        </div>

        <div class="food-item" data-price="6">
            <img src="https://images.unsplash.com/photo-1630384060421-cb20d0e0649d?w=600" alt="Fries">
            <h3>Crispy Fries</h3>
            <p>$6</p>
            <button class="order-btn" onclick="addToCart('Crispy Fries', 6)">Add to Cart</button>
        </div>

        <div class="food-item" data-price="14">
            <img src="https://images.unsplash.com/photo-1562967914-608f82629710?w=600" alt="Chicken">
            <h3>Fried Chicken</h3>
            <p>$14</p>
            <button class="order-btn" onclick="addToCart('Fried Chicken', 14)">Add to Cart</button>
        </div>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
